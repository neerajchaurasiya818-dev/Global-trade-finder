
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Trade Finder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #123c69;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      color: #123c69;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #123c69;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #16855b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .feature {
      padding: 18px;
      border-radius: 14px;
      background: #eef4fb;
      text-align: center;
      cursor: pointer;
    }

    .feature strong {
      display: block;
      margin-bottom: 6px;
      color: #123c69;
    }

    .result {
      border: 1px solid #e0e5ec;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      background: #fff;
    }

    .result h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #16855b;
      font-weight: bold;
      margin: 7px 0;
    }

    .result a {
      display: inline-block;
      margin-top: 8px;
      color: #1267b1;
      font-weight: bold;
      text-decoration: none;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #eef4fb;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 Global Trade Finder</h1>
  <p>Find products, markets, demand and trade opportunities worldwide</p>
</header>

<div class="container">

  <!-- HOME -->
  <section id="home" class="card">
    <h2>Global Trade Finder</h2>

    <p style="margin-bottom:18px;">
      Search products and explore international import & export opportunities.
    </p>

    <div class="grid">

      <div class="feature" onclick="showSection('search')">
        <strong>🔎
